<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Péter Egri – Coming soon</title>
  <link rel="icon" href="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@600;700;800&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0a0a0a;
      --mute: #3b4a52;
      --blue: #bfe6f6;
      --accent: #2aa7d8;
      --ghost-dots: #E0607E;
      --ghost-fill: #f7e3e3;
      color-scheme: light;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 400 1.05rem/1.6 'Barlow', system-ui, sans-serif;
      overflow-x: hidden;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .page {
      position: relative;
      isolation: isolate;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: center;
      padding: max(1.2rem, env(safe-area-inset-top)) 5vw max(1.2rem, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    /* Középső rész */
    main {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: clamp(.4rem, 2svh, 1rem);
      width: 100%;
      padding: .5rem 0;
    }
    .stage {
      position: relative;
      width: min(86vw, 40svh);
      aspect-ratio: 1;
      border-radius: 22px;
      background-color: var(--blue);
      background-image: radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.4px);
      background-size: 4px 4px;
      box-shadow: 9px 9px 0 var(--text);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(10,10,10,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,10,10,.08) 1px, transparent 1px);
      background-size: 10% 10%;
    }
    .v3d {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      cursor: grab;
      touch-action: pan-y;
    }
    .v3d:active { cursor: grabbing; }
    .v3d canvas { display: block; width: 100%; height: 100%; border-radius: inherit; }
    .v3d.drop { outline: 3px dashed var(--accent); }

    /* Cím + pixeles szellemszöveg (mint a portfólión: a szellemszöveg a cím fölött, kicsit ráér) */
    .title { --g: clamp(2.2rem, 9vw, 8rem); position: relative; margin-top: calc(var(--g) * .64); margin-bottom: clamp(1.2rem, 5svh, 3rem); }
    .title::before {
      content: "COMING SOON";
      position: absolute;
      left: 50%;
      top: -.64em;
      transform: translateX(-50%);
      z-index: -1;
      white-space: nowrap;
      pointer-events: none;
      font: 700 var(--g)/.9 'Pixelify Sans', monospace;
      letter-spacing: .06em;
      background-image: radial-gradient(circle, var(--ghost-dots) 1px, transparent 1.5px), linear-gradient(var(--ghost-fill), var(--ghost-fill));
      background-size: 4px 4px, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    .title h1 {
      margin: 0;
      font: 800 clamp(2.6rem, 8vw, 5.4rem)/.95 'Barlow Condensed', system-ui, sans-serif;
      letter-spacing: .02em;
      text-transform: uppercase;
      text-align: center;
    }
    .tagline { margin: 0; margin-top: clamp(1.2rem, 5svh, 3rem); color: var(--mute); text-align: center; font-size: clamp(.8rem, .9vw + .35rem, 1.2rem); }

    /* Nagy, magas képernyőn a nagy távolság marad, kisebb képernyőn (telefon, alacsony ablak) összenyomódik, hogy ne kelljen görgetni */
    @media (min-width: 821px) and (min-height: 800px) {
      main { gap: 10rem; padding: 1.5rem 0; }
    }
    @media (max-width: 820px), (max-height: 799px) {
      .title { margin-bottom: clamp(.6rem, 2.5svh, 1.2rem); }
      .tagline { margin-top: clamp(.6rem, 2.5svh, 1.2rem); }
      .stage { width: min(78vw, 38svh); box-shadow: 7px 7px 0 var(--text); }
    }
    @media (max-height: 640px) and (orientation: landscape) {
      .stage { width: min(40vw, 46svh); }
      .title h1 { font-size: clamp(2rem, 6vw, 3.4rem); }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <div class="title"><h1>Coming soon</h1></div>
      <div class="stage">
        <div class="v3d" data-src="portre.glb" aria-label="Rotatable 3D portrait"></div>
      </div>
      <p class="tagline">© 2026 Péter Egri</p>
    </main>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // A portre.glb fájlnak ennek a html-nek a mappájában kell lennie.
    // Ha a fájl nem található, egy tartalék alakzat jelenik meg, így az oldal nem marad üresen.
    (function () {
      var el = document.querySelector('.v3d');

      var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      el.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
      camera.position.set(0, 0.5, 4.2);

      scene.add(new THREE.AmbientLight(0xffffff, 0.95));
      scene.add(new THREE.HemisphereLight(0xffffff, 0x6b6490, 0.35));
      var sun = new THREE.DirectionalLight(0xffffff, 0.55);
      sun.position.set(3, 4, 3);
      scene.add(sun);

      var controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotateSpeed = 2;
      controls.minDistance = 2.5;
      controls.maxDistance = 7;
      controls.maxPolarAngle = Math.PI / 2; // alulról nem nézhető

      var holder = new THREE.Group();
      scene.add(holder);

      function setModel(obj) {
        holder.clear();
        var box = new THREE.Box3().setFromObject(obj);
        var size = box.getSize(new THREE.Vector3());
        var center = box.getCenter(new THREE.Vector3());
        var k = 2 / Math.max(size.x, size.y, size.z);
        obj.scale.multiplyScalar(k);
        obj.position.sub(center.multiplyScalar(k));
        holder.add(obj);
      }

      function fallback() {
        setModel(new THREE.Mesh(
          new THREE.TorusKnotGeometry(0.7, 0.26, 160, 24),
          new THREE.MeshStandardMaterial({ color: '#ff4f81', roughness: 0.45, metalness: 0.1 })
        ));
      }

      var loader = new THREE.GLTFLoader();
      loader.load(el.dataset.src, function (g) { setModel(g.scene); }, undefined, fallback);

      // Teszteléshez: egy .glb fájl ráhúzható a modellre
      el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('drop'); });
      el.addEventListener('dragleave', function () { el.classList.remove('drop'); });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        el.classList.remove('drop');
        var f = e.dataTransfer.files[0];
        if (!f) return;
        f.arrayBuffer().then(function (buf) {
          loader.parse(buf, '', function (g) { setModel(g.scene); });
        });
      });

      function resize() {
        var w = el.clientWidth, h = el.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      new ResizeObserver(resize).observe(el);
      resize();

      (function loop() {
        requestAnimationFrame(loop);
        controls.update();
        renderer.render(scene, camera);
      })();
    })();
  </script>
</body>
</html>
